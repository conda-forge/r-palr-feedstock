{% set version = "0.5.0" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-palr
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/palr_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/palr/palr_{{ version }}.tar.gz
  sha256: 34c417725d649d4dbcb841399513655e2a8b8f0fd4b1edd77243bc5349f15f30

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ posix }}zip               # [win]
  host:
    - r-base
  run:
    - r-base

test:
  commands:
    - $R -e "library('palr')"           # [not win]
    - "\"%R%\" -e \"library('palr')\""  # [win]

about:
  home: https://github.com/AustralianAntarcticDivision/palr
  license: GPL-3.0-only
  summary: Colour palettes for data, based on some well known public data sets.
  license_family: GPL3
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3

extra:
  recipe-maintainers:
    - conda-forge/r
